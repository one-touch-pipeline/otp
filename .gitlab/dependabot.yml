#documentation config file: https://dependabot-gitlab.gitlab.io/dependabot/config/configuration.html

version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    open-pull-requests-limit: 10
    commit-message:
      prefix: "Update: "
    ignore:
      # The following dependencies will be upgraded to v2.1 from v1.10, see youtrack issue otp-2590
      - dependency-name: "org.webjars:datatables"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      - dependency-name: "org.webjars:datatables-plugins"
        versions: [ "9dcbecd42ad", "15ba23c72a", "b644af9c80", "ca6ec50" ]
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      - dependency-name: "org.webjars:datatables-buttons"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
        # Can be updated with Groovy 4
      - dependency-name: "org.codenarc:CodeNarc"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      # Can be updated with Groovy 4
      - dependency-name: "com.github.theroddywms:RoddyToolLib"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      # Can be updated with Groovy 4
      - dependency-name: "org.codenarc:BatchEuphoria"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      - dependency-name: "org.springframework.security:spring-security-*"
        versions: [ "31d4ce8", "acf1d34", "2686af0", "8407c9e", "f66a5ba" ]
        update-types: [ "version-update:semver-major" ]
      # Grails/GORM is closely coupled with hibernate and does not allow major or minor updates
      - dependency-name: "org.hibernate:hibernate-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.liquibase:liquibase-core"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      # Grails 6 requires asset pipeline major version 4, while Grails 7 requires version 5
      - dependency-name: "com.bertramlabs.plugins:*"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      # version 3.14.0 is required by the used version of asset pipeline, which can only updated after Grails update
      - dependency-name: "org.apache.commons:commons-lang3"
      # This dependency will be removed in the future, see youtrack issue otp-2710
      - dependency-name: "org.junit.vintage:junit-vintage-engine"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      # These dependencies below are under investigation, deactivate them first
      - dependency-name: "org.cyclonedx.bom"
        update-types: [ "version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch" ]
      # Grails 6 requires gradle 7.6.x
      - dependency-name: "gradle-wrapper"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      # Grails 6 requires Spring Boot 2.7
      - dependency-name: "org.springframework.boot:spring-boot-starter-actuator"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      # Can be upgraded to version 3 if jackson also gets upgraded to version 3
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: [ "version-update:semver-major" ]
      # Not clear yet if jacocolog version 4 is compatible with gradle 7
      - dependency-name: "org.barfuin.gradle.jacocolog"
        update-types: [ "version-update:semver-major" ]
    rebase-strategy: none
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Update: "
    rebase-strategy: none
